# A2 default config.
#
# Single-GPU launch:
#     uv run python train.py --task a2 --config tasks/a2/default.yaml
#
# Multi-GPU (DDP) launch — auto-detected from torchrun env vars:
#     uv run torchrun --standalone --nproc_per_node=4 train.py \
#         --task a2 --config tasks/a2/default.yaml
#
# DDP notes:
#  * Effective batch size = batch_size * world_size; consider scaling lr by
#    sqrt(world_size) (or linear) if you change cluster sizes.
#  * preload=true makes each rank keep its own RAM copy of features; verify
#    train_gb*world_size fits in host memory before scaling up.
#  * Best checkpoint is saved once on rank 0 with EMA weights baked in.

feature_root: /data/maluzhang-folder/datasets/AdoDAS_Challenge/features
manifest_dir: /data/maluzhang-folder/datasets/AdoDAS_Challenge/manifests
output_dir: ./output/a2-4mlp

feature_selection:
  audio_features:
    - mel_mfcc
    - vad
    - egemaps
    - ssl_embed
  video_features:
    - headpose_geom
    - face_behavior
    - qc_stats
    - vad_agg
    # - body_pose
    # - global_motion
    - vision_ssl_embed
  audio_ssl_model_tag: chinese-hubert-large
  video_ssl_model_tag: vit-mae-base

mask_policy: and_core
core_audio: [mel_mfcc, ssl_embed]
core_video: [vision_ssl_embed, qc_stats]

d_adapter: 64
d_model: 256
tcn_layers: 6
tcn_kernel_size: 3
asp_alpha: 0.5
asp_beta: 0.5
dropout: 0.2
d_shared: 256

aggregator: mlp
use_coral: true
batch_size: 64
lr: 0.001
weight_decay: 0.01
warmup_epochs: 3
# v5 (200 epoch) showed best EMA QWK at epoch 52, then a 25% degradation by
# epoch 200. Cap at 60 with QWK-monitored early stop so we don't burn compute
# past the peak. Cosine schedule still completes within this window.
epochs: 60
seed: 42
num_workers: 8
amp: true
preload: true
grad_clip: 1.0
use_pos_weight: true
# Headroom past the typical peak (~ep 50) so noise doesn't trigger early.
patience: 12
early_stop: true
session_loss_weight: 0.5
session_type_loss_weight: 0.15
submission_level: participant
decode_method: auto
label_smoothing: 0.05
feature_noise_std: 0.01
session_drop_prob: 0.1
# val_loss barely tracks QWK on this task (Δ 3% over the whole run vs Δ 30%+
# on QWK). Use the actual selection metric instead.
early_stop_metric: mean_qwk

# A2 loss composition: BCE (ordinal) + Gaussian-soft-label CE + EMD.
# Set soft_ce_weight=0 and emd_weight=0 to fall back to pure BCE.
bce_weight: 1.0
soft_ce_weight: 0.5
emd_weight: 0.3
soft_label_sigma: 1.0
emd_norm: 2

# Focal modulation on the BCE term: (1 - p_t)^gamma reweights so the loss
# concentrates on hard examples — primarily the rarely-positive class-3
# thresholds where v5 still saw bot3 per-item QWK around 0.10. 0.0 = plain BCE.
# Try 1.5–2.0 if you want to push class-2/3 signal further.
focal_gamma: 0.0

# Upper bound on per-(item, threshold) BCE pos_weight = sqrt((1-p)/p).
# v4/v5 used 10 which silently truncated weights for items with
# P(y>=3) < 1%, eating signal on the rarest positives. 20 keeps gradients
# meaningful without making BCE explode at init.
pos_weight_cap: 20.0

# DASS subscale auxiliary regression head (D/A/S sums, 7 items each).
# Injects task structure: each subscale total = ×2 weighted sum of 7 items.
# Set 0.0 to disable.
subscale_loss_weight: 0.3

# EMA (exponential moving average) of model weights for inference smoothing.
# Validation, best-checkpoint selection, and submission all use EMA weights
# starting from `ema_start_epoch`. Typical gains: +0.3–0.8 QWK on small data.
use_ema: true
ema_decay: 0.999
ema_start_epoch: 5
